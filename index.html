<html lang="vi">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #edf4fa;
      --bg-card: rgba(255, 255, 255, 0.88);
      --primary: #4a7bb0;
      --primary-hover: #3b6594;
      --primary-light: #e2eef9;
      --accent-pastel: #87b3db;
      --accent-soft: #b9d5ed;
      --text-dark: #2c3e50;
      --text-muted: #6c829b;
      --border-color: #d2e3f3;
      --success: #52a386;
      --danger: #e06d75;
      --shadow-sm: 0 4px 12px rgba(67, 108, 149, 0.08);
      --shadow-md: 0 8px 24px rgba(67, 108, 149, 0.12);
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      line-height: 1.5;
      padding-bottom: 60px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(135, 179, 219, 0.15) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(185, 213, 237, 0.2) 0%, transparent 25%),
        url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0 C45 20, 60 35, 80 40 C60 45, 45 60, 40 80 C35 60, 20 45, 0 40 C20 35, 35 20, 40 0 Z' fill='%2094bee0' fill-opacity='0.04'/%3E%3C/svg%3E");
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    /* Elegant Header */
    header {
      text-align: center;
      padding: 30px 20px;
      margin-bottom: 25px;
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "❀ ❁ ❀";
      display: block;
      font-size: 1.2rem;
      color: var(--accent-pastel);
      letter-spacing: 6px;
      margin-bottom: 5px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      color: #244469;
      font-size: 2.1rem;
      font-weight: 700;
    }

    header p {
      color: var(--text-muted);
      font-style: italic;
      margin-top: 5px;
      font-size: 0.95rem;
    }

    /* Dashboard Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .summary-card {
      background: var(--bg-card);
      padding: 20px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid white;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .summary-card:hover { transform: translateY(-3px); }

    .summary-card h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .summary-card .amount {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .summary-card.grand-total {
      background: linear-gradient(135deg, #4a7bb0, #365d88);
      color: white;
    }

    .summary-card.grand-total h3 { color: rgba(255, 255, 255, 0.85); }
    .summary-card.grand-total .amount { color: #ffffff; font-size: 1.7rem; }

    .progress-bar-bg {
      background: #dce7f3;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      background: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Action Buttons Bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: white; color: var(--primary); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: var(--primary-light); }
    .btn-danger-soft { background: #fde8e8; color: var(--danger); }
    .btn-danger-soft:hover { background: #fbcbcb; }

    /* Main Section Style */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #1e3a5f;
      margin: 35px 0 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 2px dashed var(--accent-pastel);
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .subject-header {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2b5278;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--primary-light);
      border-radius: var(--radius-md);
      width: fit-content;
    }

    .sub-group-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      margin: 15px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Table Styling */
    .item-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }

    .item-table th {
      text-align: left;
      padding: 10px;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    .item-table td {
      padding: 10px;
      border-bottom: 1px solid #f0f5fa;
      font-size: 0.92rem;
      vertical-align: middle;
    }

    .item-row.bought {
      background-color: rgba(235, 243, 250, 0.5);
    }

    .item-row.bought .item-name {
      text-decoration: line-through;
      color: #9cb1c9;
    }

    .checkbox-custom {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 6px;
      border-radius: 4px;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .btn-icon:hover { color: var(--primary); }
    .btn-icon.delete:hover { color: var(--danger); }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 50, 70, 0.4);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-md);
    }

    .modal-header {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-dark);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 123, 176, 0.15);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* Print Styles */
    @media print {
      body { background: white; color: black; padding: 0; }
      .action-bar, .btn-icon, .modal { display: none !important; }
      .card, header { box-shadow: none; border: 1px solid #ccc; background: white; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .item-table th:nth-child(4), .item-table td:nth-child(4) { display: none; }
      .summary-card .amount { font-size: 1.3rem; }
    }
  </style>
</head>

        </div>

        <div class="form-group" id="groupCategory" style="display: none;">

            <option value="Vở ghi">Vở ghi & Dụng cụ</option>

        </div>
        <div class="form-group">

        </div>
        <div class="form-group">

        <div class="form-group">
          <label>Số Lượng</label>

        </div>
        <div class="modal-footer">

      { id: '46', part: 'p2', subject: 'HSA', category: 'Sách tham khảo', name: 'HSA Anh MOON', price: 135, qty: 1, calc: true, bought: false },
      { id: '47', part: 'p2', subject: 'HSA', category: 'Sách tham khảo', name: 'HSA 333 câu hỏi tiếng Anh', price: 54, qty: 1, calc: true, bought: false },
      { id: '48', part: 'p2', subject: 'HSA', category: 'Sách tham khảo', name: 'HSA Văn MOON', price: 137, qty: 1, calc: true, bought: false },
      { id: '49', part: 'p2', subject: 'HSA', category: 'Sách tham khảo', name: 'HSA Toán - Tổng Ôn Phần Học Và Kỹ Sư Lỗi', price: 137, qty: 1, calc: true, bought: false },
      { id: '50', part: 'p2', subject: 'HSA', category: 'Sách tham khảo', name: 'HSA Toán - Định hướng và định hình', price: 212, qty: 1, calc: true, bought: false },
      { id: '51', part: 'p2', subject: 'HSA', category: 'Sách tham khảo', name: 'Bộ đề thi ĐGNL ĐHQGHN', price: 185, qty: 1, calc: true, bought: false },
      { id: '52', part: 'p2', subject: 'HSA', category: 'Vở ghi', name: 'Ruột sổ còng Dash Line A4 100 tờ (MS: 527)', price: 39, qty: 4, calc: true, bought: false },
      { id: '53', part: 'p2', subject: 'HSA', category: 'Vở ghi', name: 'Sổ kẻ ngang may dán gáy (MS 849) 120 trang', price: 24, qty: 1, calc: true, bought: false },
      { id: '54', part: 'p2', subject: 'HSA', category: 'Vở ghi', name: 'Vở Campus - Basic có chấm 200 trang', price: 37, qty: 1, calc: true, bought: false },
      { id: '55', part: 'p2', subject: 'HSA', category: 'Vở ghi', name: 'Vở Campus - Basic có chấm 200 trang', price: 37, qty: 1, calc: true, bought: false },
      { id: '56', part: 'p2', subject: 'HSA', category: 'Vở ghi', name: 'Sổ kẻ ngang may dán gáy (MS 849) 120 trang', price: 24, qty: 1, calc: true, bought: false },

      // --- MÔN VĂN ---
      { id: '57', part: 'p2', subject: 'Văn', category: 'Sách tham khảo', name: 'CHINH PHỤC 10 ĐỌC HIỂU', price: 200, qty: 1, calc: true, bought: false },
      { id: '58', part: 'p2', subject: 'Văn', category: 'Vở ghi', name: 'Vở Campus - Basic có chấm 200 trang', price: 37, qty: 1, calc: true, bought: false }
    ];

    // Sử dụng key 'study_items_v3' để đảm bảo trình duyệt tải dữ liệu mới nhất
    let items = JSON.parse(localStorage.getItem('study_items_v3')) || JSON.parse(JSON.stringify(defaultData));

    function formatMoney(amount) {
      return (amount * 1000).toLocaleString('vi-VN') + ' VNĐ';
    }

    function render() {
      // Render Phần 1
      const p1List = document.getElementById('list-p1');
      p1List.innerHTML = '';
      const p1Items = items.filter(i => i.part === 'p1');
      
      p1Items.forEach(item => {
        p1List.appendChild(createRow(item));
      });

      // Render Phần 2 theo môn
      const p2Container = document.getElementById('container-p2');
      p2Container.innerHTML = '';

      const subjects = [
        { name: 'Toán', icon: '📐' },
        { name: 'Vật Lý', icon: '⚡' },
        { name: 'Tiếng Anh', icon: '🔤' },
        { name: 'HSA', icon: '🎓' },
        { name: 'Văn', icon: '📖' }
      ];

      subjects.forEach(sub => {
        const subItems = items.filter(i => i.part === 'p2' && i.subject === sub.name);
        if (subItems.length === 0) return;

        const card = document.createElement('div');
        card.className = 'card';

        let html = `<div class="subject-header">${sub.icon} Môn ${sub.name}</div>`;

        ['Sách tham khảo', 'Vở ghi'].forEach(cat => {
          const catItems = subItems.filter(i => i.category === cat);
          if (catItems.length > 0) {
            html += `<div class="sub-group-title">${cat === 'Sách tham khảo' ? '📚 Sách Tham Khảo' : '📓 Vở Ghi & Dụng Cụ'}</div>`;
            html += `
              <table class="item-table">
                <thead>
                  <tr>
                    <th style="width: 35px;">Tính</th>
                    <th style="width: 35px;">Mua</th>
                    <th>Tên Món Đồ</th>
                    <th>Đơn Giá</th>
                    <th>SL</th>
                    <th>Thành Tiền</th>
                    <th style="width: 60px;"></th>
                  </tr>
                </thead>
                <tbody id="tbl-${sub.name}-${cat}"></tbody>
              </table>
            `;
          }
        });

        card.innerHTML = html;
        p2Container.appendChild(card);

        // Fill data into tables
        ['Sách tham khảo', 'Vở ghi'].forEach(cat => {
          const tbody = document.getElementById(`tbl-${sub.name}-${cat}`);
          if (tbody) {
            const catItems = subItems.filter(i => i.category === cat);
            catItems.forEach(item => tbody.appendChild(createRow(item)));
          }
        });
      });

      updateCalculations();
      saveToStorage();
    }

    function createRow(item) {
      const tr = document.createElement('tr');
      tr.className = `item-row ${item.bought ? 'bought' : ''}`;
      const total = item.price * item.qty;

      tr.innerHTML = `
        <td><input type="checkbox" class="checkbox-custom" ${item.calc ? 'checked' : ''} onchange="toggleCalc('${item.id}')"></td>
        <td><input type="checkbox" class="checkbox-custom" ${item.bought ? 'checked' : ''} onchange="toggleBought('${item.id}')"></td>
        <td class="item-name"><strong>${item.name}</strong></td>
        <td>${item.price}k</td>
        <td>${item.qty}</td>
        <td><strong>${formatMoney(total)}</strong></td>
        <td>
          <button class="btn-icon" onclick="editItem('${item.id}')">✏️</button>
          <button class="btn-icon delete" onclick="deleteItem('${item.id}')">🗑️</button>
        </td>
      `;
      return tr;
    }

    function updateCalculations() {
      let totalP1 = 0;
      let totalP2 = 0;
      let boughtCount = 0;

      items.forEach(item => {
        const total = item.price * item.qty;
        if (item.calc) {
          if (item.part === 'p1') totalP1 += total;
          if (item.part === 'p2') totalP2 += total;
        }
        if (item.bought) boughtCount++;
      });

      document.getElementById('total-p1').innerText = formatMoney(totalP1);
      document.getElementById('total-p2').innerText = formatMoney(totalP2);
      document.getElementById('grand-total').innerText = formatMoney(totalP1 + totalP2);

      const totalItems = items.length;
      document.getElementById('purchase-progress').innerText = `${boughtCount}/${totalItems}`;
      const percentage = totalItems > 0 ? (boughtCount / totalItems) * 100 : 0;
      document.getElementById('progress-fill').style.width = `${percentage}%`;
    }

    function toggleCalc(id) {
      const item = items.find(i => i.id === id);
      if (item) { item.calc = !item.calc; render(); }
    }

    function toggleBought(id) {
      const item = items.find(i => i.id === id);
      if (item) { item.bought = !item.bought; render(); }
    }

    function deleteItem(id) {
      if (confirm('Bạn muốn xóa món đồ này khỏi danh sách?')) {
        items = items.filter(i => i.id !== id);
        render();
      }
    }

    function openModal(editId = null) {
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('modalTitle').innerText = 'Thêm Món Đồ Mới';
      togglePartSelect();

      if (editId) {
        const item = items.find(i => i.id === editId);
        if (item) {
          document.getElementById('itemId').value = item.id;
          document.getElementById('itemPart').value = item.part;
          document.getElementById('itemName').value = item.name;
          document.getElementById('itemPrice').value = item.price;
          document.getElementById('itemQty').value = item.qty;
          togglePartSelect();
          if (item.part === 'p2') {
            document.getElementById('itemSubject').value = item.subject || 'Toán';
            document.getElementById('itemCategory').value = item.category || 'Sách tham khảo';
          }
          document.getElementById('modalTitle').innerText = 'Chỉnh Sửa Món Đồ';
        }
      }
      document.getElementById('itemModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('itemModal').style.display = 'none';
    }

    function togglePartSelect() {
      const part = document.getElementById('itemPart').value;
      const display = part === 'p2' ? 'block' : 'none';
      document.getElementById('groupSubject').style.display = display;
      document.getElementById('groupCategory').style.display = display;
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const part = document.getElementById('itemPart').value;
      const name = document.getElementById('itemName').value;
      const price = parseFloat(document.getElementById('itemPrice').value);
      const qty = parseInt(document.getElementById('itemQty').value);

      let itemData = {
        id: id || Date.now().toString(),
        part, name, price, qty,
        calc: true, bought: false
      };

      if (part === 'p2') {
        itemData.subject = document.getElementById('itemSubject').value;
        itemData.category = document.getElementById('itemCategory').value;
      }

      if (id) {
        const index = items.findIndex(i => i.id === id);
        items[index] = { ...items[index], ...itemData };
      } else {
        items.push(itemData);
      }

      closeModal();
      render();
    }

    function editItem(id) {
      openModal(id);
    }

    function resetDefaultData() {
      if (confirm('Khôi phục toàn bộ danh sách đồ dùng học tập & sách vở về ban đầu?')) {
        items = JSON.parse(JSON.stringify(defaultData));
        render();
      }
    }

    function saveToStorage() {
      localStorage.setItem('study_items_v3', JSON.stringify(items));
    }

    // Khởi tạo
    render();
  </script>
</body>
</html>
